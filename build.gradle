plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.planit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 웹 (정적 리소스 서빙). 데이터/인증은 Firebase 로 옮겨져 프론트엔드에서 직접 연동한다.
	// (MySQL/JPA, Spring Security, Validation 의존성은 Firebase 전환으로 제거됨)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 참고: 경로에 한글이 섞여 있으면(예: 팀프로젝트/노예) Windows 기본 코드페이지에 따라
	// 테스트 워커가 클래스를 못 찾는 경우가 있다 (JVM 의 sun.jnu.encoding 이 OS 로케일에 고정되는 문제).
	// 이 리포지토리를 영문 경로에 클론해서 실행하면 발생하지 않는다.
	jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.jnu.encoding=UTF-8'
}
